debugCommands = false
maxDistillationTowerHeight = 9
defaultIndustrialistTrades = true

[compat]
	# Enable bidirectional energy compatibility with NeoForge's energy system (FE <-> EU).
	bidirectionalEnergyCompat = true
	ae2Integration = true
	almostUnifiedIntegration = true

[datagen]
	datagenOnStartup = false
	loadRuntimeGeneratedResources = false
